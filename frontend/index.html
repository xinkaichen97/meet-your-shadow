<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shadow Self-Reflection</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f6f4f9;
    --card: #ffffff;
    --ink: #2c2a3a;
    --muted: #8b87a0;
    --accent: #6b5b95;
    --accent-soft: #ece8f6;
    --border: #ece8f4;
    --crisis-bg: #fdeeee;
    --crisis-border: #e8b4b4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.65;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 32px 90px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px;
    box-shadow: 0 4px 24px rgba(44, 42, 58, 0.06);
  }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 18px; }
  h1.big-title { font-size: 2.2rem; line-height: 1.25; margin-bottom: 8px; }
  p.shadow-label { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  h1.hero-title { font-size: 2.6rem; line-height: 1.2; margin-bottom: 20px; }
  img.hero-thumb { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 14px; margin-bottom: 28px; }
  p.hero-lead { font-size: 1.15rem; margin-bottom: 34px; }
  p.type-preview-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
  ul.type-preview-list { list-style: none; margin: 0 0 34px; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
  ul.type-preview-list li { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 8px 16px; font-size: 0.88rem; }
  p { color: var(--muted); }
  .framing p { margin: 0 0 14px; font-size: 1.05rem; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 13px 26px;
    background: var(--accent);
    color: white;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:hover { opacity: 0.9; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.3; cursor: not-allowed; }
  button.secondary { background: var(--accent-soft); color: var(--accent); }
  button.link {
    background: none;
    color: var(--muted);
    padding: 8px 0;
    font-size: 0.9rem;
  }

  .lang-switch {
    position: fixed;
    top: 20px;
    right: 24px;
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    box-shadow: 0 2px 10px rgba(44, 42, 58, 0.1);
    z-index: 100;
  }
  .lang-switch button {
    background: none;
    color: var(--muted);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
  }
  .lang-switch button.active { background: var(--accent); color: white; }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .floating { animation: floatIn 0.5s cubic-bezier(.2,.8,.2,1) both; }

  .question { margin-bottom: 40px; }
  .question:last-child { margin-bottom: 0; }
  .question p.text { color: var(--ink); font-size: 1.28rem; margin: 0 0 20px; font-weight: 450; }

  .scale { display: flex; gap: 14px; justify-content: center; }
  .dotbtn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--muted);
    padding: 0;
    font-size: 1.05rem;
    display: flex; align-items: center; justify-content: center;
  }
  .dotbtn:hover { border-color: var(--accent); color: var(--accent); opacity: 1; }
  .dotbtn.selected { background: var(--accent); border-color: var(--accent); color: white; }
  .scale-labels {
    display: flex; justify-content: space-between;
    max-width: 340px; margin: 10px auto 0;
    font-size: 0.78rem; color: var(--muted);
  }

  .nav-row { margin-top: 36px; display: flex; justify-content: space-between; align-items: center; }

  .followup-options { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
  .followup-options button { text-align: left; white-space: normal; }
  .followup-options button.selected { background: var(--accent); color: white; }

  .report { font-size: 1.08rem; }
  .narrative-section { margin-bottom: 28px; }
  .narrative-section:last-child { margin-bottom: 0; }
  .narrative-section h3 { font-size: 1.02rem; color: var(--accent); margin: 0 0 8px; font-weight: 600; }

  .grounding-block { background: var(--accent-soft); border-radius: 12px; padding: 14px 20px; margin-bottom: 22px; }
  .grounding-label { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin: 0 0 6px; }
  .grounding-list { margin: 0; padding-left: 18px; color: var(--ink); font-size: 0.92rem; }
  .grounding-list li { margin-bottom: 4px; }
  .grounding-list li:last-child { margin-bottom: 0; }

  .chat-log { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
  .bubble { padding: 13px 17px; border-radius: 14px; max-width: 85%; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: var(--accent); color: white; }
  .bubble.agent { align-self: flex-start; background: var(--accent-soft); color: var(--ink); }
  .bubble.crisis { align-self: stretch; background: var(--crisis-bg); border: 1px solid var(--crisis-border); color: var(--ink); }
  .bubble.thinking { align-self: flex-start; background: var(--accent-soft); }

  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin: 0 2px; animation: blink 1.3s infinite both; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  .chat-input-row { display: flex; gap: 10px; margin-top: 20px; }
  .chat-input-row input {
    flex: 1;
    font: inherit;
    padding: 13px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .spinner { color: var(--ink); font-size: 1.4rem; font-weight: 450; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="lang-switch" id="lang-switch">
  <button type="button" class="active" data-lang="en">EN</button>
  <button type="button" data-lang="zh">中文</button>
</div>
<div class="wrap">
  <div class="card" id="app-root"></div>
</div>

<script>
const QUESTIONS = [
  {id: "q1",  text: "Sometimes I wish someone would take care of me, instead of me always being the one taking care of others."},
  {id: "q2",  text: "When someone constantly talks about how hard things are for them, I find it a little pathetic."},
  {id: "q3",  text: "I often wish someone could truly understand what I'm thinking without me having to explain."},
  {id: "q4",  text: "When someone always needs to say what's on their mind to feel okay, I find that a bit weak."},
  {id: "q5",  text: "There are times I really want to say no, but the words get stuck before I say them."},
  {id: "q6",  text: "When someone flatly says \"I don't want to,\" I secretly think they're a bit selfish."},
  {id: "q7",  text: "I actually feel angry fairly often, I just rarely show it."},
  {id: "q8",  text: "When someone loses their temper in public, I think that's poor self-control."},
  {id: "q9",  text: "After making a decision, I often still can't stop thinking about the other options I didn't choose."},
  {id: "q10", text: "When someone settles into a decision quickly and stops second-guessing, I think they lack ambition."},
  {id: "q11", text: "I often sense things are going to happen before they do, but I rarely say so because I doubt anyone would believe me."},
  {id: "q12", text: "When someone keeps saying \"I had a feeling about this,\" I find it a bit theatrical."},
  {id: "q13", text: "There are things I genuinely want, but I often feel I shouldn't want them."},
  {id: "q14", text: "When someone openly says what they want without hesitation, I think that's a little greedy."},
  {id: "q15", text: "There are things from a long time ago that I say I've let go of, but I haven't, not really."},
  {id: "q16", text: "When someone keeps bringing up the past and won't let it go, I think they're being unreasonable."},
];

const QUESTIONS_ZH = {
  q1: "有时候我希望有人能照顾我，而不是总是我在照顾别人。",
  q2: "当有人总是诉说自己有多辛苦时，我会觉得有点可怜。",
  q3: "我常常希望有人能真正理解我的想法，而不需要我去解释。",
  q4: "当有人总是需要把心里话说出来才能安心时，我觉得这有点软弱。",
  q5: "有时候我真的很想拒绝，但话到嘴边又说不出口。",
  q6: "当有人直接说“我不想”时，我心里会觉得这个人有点自私。",
  q7: "其实我经常感到生气，只是很少表现出来。",
  q8: "当有人在公共场合发脾气时，我会觉得这是缺乏自我控制。",
  q9: "做出决定之后，我常常还是忍不住去想那些我没选的其他选项。",
  q10: "当有人很快就能做出决定、不再纠结时，我会觉得这个人缺乏进取心。",
  q11: "我常常能预感到事情会发生，但很少说出来，因为我觉得没人会相信我。",
  q12: "当有人总是说“我早就有预感”时，我会觉得有点夸张。",
  q13: "有些东西我真的很想要，但我常常觉得自己不应该想要。",
  q14: "当有人毫不犹豫地说出自己想要什么时，我会觉得这有点贪心。",
  q15: "有些很久以前的事，我嘴上说已经放下了，但其实并没有真正放下。",
  q16: "当有人总是提起过去、不肯放下时，我会觉得这个人不讲道理。",
};

const GROUP_SIZE = 8;

// Titles only (not the full anchor descriptions) — used both for the
// framing page's preview list and to instantly relabel the report screen's
// big title on a language switch (keyed by shadow_type so it can be looked
// up directly, unlike the report body, which needs actual translation).
const SHADOW_TITLES = {
  unpermitted_vulnerability: "The Vulnerability I Wasn't Allowed",
  silent_isolation: "The Isolation I Chose",
  unspoken_resentment: "The Resentment I Never Said",
  suppressed_anger: "The Anger I Wasn't Allowed",
  restless_uncertainty: "The Choice I Can't Let Go Of",
  unvoiced_intuition: "The Knowing I Learned to Doubt",
  forbidden_want: "The Wanting I Called Selfish",
  unfinished_past: "The Past I Said I'd Let Go",
};

const SHADOW_TITLES_ZH = {
  unpermitted_vulnerability: "不被允许的脆弱",
  silent_isolation: "我选择的孤独",
  unspoken_resentment: "从未说出口的怨气",
  suppressed_anger: "不被允许的愤怒",
  restless_uncertainty: "放不下的选择",
  unvoiced_intuition: "被我学会怀疑的直觉",
  forbidden_want: "被我称作自私的渴望",
  unfinished_past: "我说已放下的过去",
};

const STRINGS = {
  en: {
    heroTitle: "Find out your shadows",
    heroLead1: "Everyone carries parts of themselves they've learned to hide — from others, and sometimes from themselves. Carl Jung called this the <strong>shadow</strong>: the parts of our personality we don't consciously acknowledge, which tend to surface instead as strong reactions to seeing them in other people.",
    heroLead2: "This short, gentle, AI-powered reflection points to one of eight common patterns hiding in your answers. It won't label you, and if you're not in a steady place right now, it's okay to come back another time.",
    startBtn: "Ready when you are",
    scaleLow: "Strongly disagree",
    scaleHigh: "Strongly agree",
    next: "Next",
    submit: "Submit",
    back: "← Back",
    followupTitle: (count) => (count === 1 ? "One more question" : "A couple more things"),
    continueBtn: "Continue",
    yourShadowIs: "Your Shadow Is",
    relevantIdeas: "Relevant ideas",
    chatPlaceholder: "Say whatever comes to mind...",
    send: "Send",
    chatHint: "You can keep talking about the reflection above, at your own pace.",
    processingAnswers: "Reading your answers...",
    processingReport: "Generating your report...",
    typesPreviewLabel: "Eight patterns this reflection can surface",
  },
  zh: {
    heroTitle: "发现你的阴影面",
    heroLead1: "每个人身上都藏着一些自己学会隐藏起来的部分——有时瞒着别人，有时甚至瞒着自己。荣格（Carl Jung）把这称为<strong>阴影</strong>：那些我们没有意识到的人格部分，往往会以我们对他人某些特质的强烈反应表现出来。",
    heroLead2: "这是一个简短、温和的 AI 驱动反思练习，会从你的回答中，指出八种常见模式里可能藏着的一种。它不会给你贴标签；如果你现在的状态不太稳定，晚点再来也完全没关系。",
    startBtn: "准备好了就开始",
    scaleLow: "非常不同意",
    scaleHigh: "非常同意",
    next: "下一步",
    submit: "提交",
    back: "← 返回",
    followupTitle: (count) => (count === 1 ? "还有一个小问题" : "还有几个小问题"),
    continueBtn: "继续",
    yourShadowIs: "你的阴影类型是",
    relevantIdeas: "相关理念",
    chatPlaceholder: "想说什么都可以...",
    send: "发送",
    chatHint: "你可以按自己的节奏，继续聊聊上面这段反思。",
    processingAnswers: "正在解读你的回答...",
    processingReport: "正在生成你的报告...",
    typesPreviewLabel: "本次反思可能涉及的八种模式",
  },
};

let currentLanguage = "en";
function t() { return STRINGS[currentLanguage]; }
function currentQuestionText(qid) {
  return currentLanguage === "zh" ? QUESTIONS_ZH[qid] : QUESTIONS.find((q) => q.id === qid).text;
}
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

const root = document.getElementById("app-root");
let sessionId = null;
// Whichever screen is currently showing re-registers itself here, so the
// language switcher can re-render "whatever's on screen right now" without
// each screen needing to know about the others.
let rerenderCurrentScreen = () => renderFraming();

function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// Parses the "## Section Name\n<body>" format the report output
// uses (works the same regardless of language, since it just looks for any
// "## " header, not hardcoded English section names). Falls back to plain
// text if it doesn't find any sections (e.g. a model deviation).
function renderReportBody(text) {
  const regex = /##\s+(.+?)\n([\s\S]*?)(?=\n##\s+|$)/g;
  const sections = [];
  let match;
  while ((match = regex.exec(text)) !== null) {
    sections.push({ title: match[1].trim(), body: match[2].trim() });
  }
  if (!sections.length) return `<div class="report">${text}</div>`;
  return sections
    .map((s) => `<div class="narrative-section"><h3>${s.title}</h3><div class="report">${s.body}</div></div>`)
    .join("");
}

// Streams a POST endpoint that responds with SSE ("data: {...}\n\n" chunks).
// Calls onEvent for every non-final chunk (live call/response pills), and
// returns the final chunk once the stream ends.
async function streamPost(url, body, onEvent) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, language: currentLanguage }),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  let finalData = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (raw.startsWith("data: ")) {
        const obj = JSON.parse(raw.slice(6));
        if (obj.type === "final") {
          finalData = obj;
        } else {
          onEvent(obj);
        }
      }
    }
  }
  return finalData;
}

function renderProcessing(label) {
  root.innerHTML = `
    <div class="floating">
      <p class="spinner" id="processing-text">${label}</p>
    </div>
  `;
}

function renderFraming() {
  rerenderCurrentScreen = renderFraming;
  const s = t();
  const titles = currentLanguage === "zh" ? SHADOW_TITLES_ZH : SHADOW_TITLES;
  root.innerHTML = `
    <div class="framing floating">
      <h1 class="hero-title">${s.heroTitle}</h1>
      <img class="hero-thumb" src="/img/thumbnail.png" alt="" />
      <p class="hero-lead">${s.heroLead1}</p>
      <p class="hero-lead">${s.heroLead2}</p>
      <p class="type-preview-label">${s.typesPreviewLabel}</p>
      <ul class="type-preview-list">
        ${Object.values(titles).map((title) => `<li>${title}</li>`).join("")}
      </ul>
      <div class="nav-row" style="justify-content:flex-end">
        <button id="start-btn">${s.startBtn}</button>
      </div>
    </div>`;
  document.getElementById("start-btn").onclick = () => renderQuiz();
}

function renderQuiz() {
  // Shuffle is over question IDs, not full {id, text} objects, so a
  // language switch mid-quiz can re-render the same shuffled order with
  // fresh text instead of re-shuffling.
  const orderIds = shuffled(QUESTIONS.map((q) => q.id));
  const groupsIds = chunk(orderIds, GROUP_SIZE);
  const answers = {};
  let groupIndex = 0;

  root.innerHTML = `<div id="quiz-shell"></div>`;
  const shell = document.getElementById("quiz-shell");

  function renderGroup() {
    rerenderCurrentScreen = renderGroup;
    const s = t();
    const gIds = groupsIds[groupIndex];
    const isLast = groupIndex === groupsIds.length - 1;
    const answeredCount = gIds.filter((id) => answers[id] !== undefined).length;

    shell.innerHTML = `
      <div class="floating" id="group-block">
        <div id="questions"></div>
        <div class="nav-row">
          ${groupIndex > 0 ? `<button class="link" id="back-btn">${s.back}</button>` : `<span></span>`}
          <button id="next-btn" disabled>${isLast ? s.submit : s.next}</button>
        </div>
      </div>
    `;

    const qcontainer = document.getElementById("questions");
    gIds.forEach((id) => {
      const block = el(`
        <div class="question">
          <p class="text">${currentQuestionText(id)}</p>
          <div class="scale" data-qid="${id}">
            ${[1, 2, 3, 4, 5].map((v) => `<button type="button" class="dotbtn${answers[id] === v ? " selected" : ""}" data-v="${v}">${v}</button>`).join("")}
          </div>
          <div class="scale-labels"><span>${s.scaleLow}</span><span>${s.scaleHigh}</span></div>
        </div>
      `);
      qcontainer.appendChild(block);
    });

    const nextBtn = document.getElementById("next-btn");
    nextBtn.disabled = answeredCount < GROUP_SIZE;

    qcontainer.querySelectorAll(".scale").forEach((scaleEl) => {
      scaleEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".dotbtn");
        if (!btn) return;
        const qid = scaleEl.dataset.qid;
        answers[qid] = parseInt(btn.dataset.v, 10);
        scaleEl.querySelectorAll(".dotbtn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        const count = gIds.filter((qq) => answers[qq] !== undefined).length;
        nextBtn.disabled = count < GROUP_SIZE;
      });
    });

    if (groupIndex > 0) {
      document.getElementById("back-btn").onclick = () => {
        groupIndex -= 1;
        renderGroup();
      };
    }

    nextBtn.onclick = async () => {
      if (!isLast) {
        groupIndex += 1;
        renderGroup();
        return;
      }
      renderProcessing(t().processingAnswers);
      const data = await streamPost("/api/answers", { answers }, (evt) => {
        if (evt.type === "phase" && evt.phase === "report") {
          const el = document.getElementById("processing-text");
          if (el) el.textContent = t().processingReport;
        }
      });
      sessionId = data.session_id;
      handleTurnResult(data);
    };
  }

  renderGroup();
}

function handleTurnResult(data) {
  if (!data.report_generated && data.followup_details && data.followup_details.length) {
    renderFollowupPage(data.followup_details);
    return;
  }
  if (data.report_generated) {
    renderReport(data);
    return;
  }
  renderReport({ final_report: data.reply, top_type_title: data.top_type_title });
}

// details: [{shadow_type, prompt, option_a, option_b}, ...] — generated
// server-side per-session by FollowUpAgent, so (unlike the old fixed
// templates) switching language here only relabels the surrounding chrome
// in place, the same "no retroactive translation" rule the report screen
// already follows — already-generated questions don't regenerate.
function renderFollowupPage(details) {
  rerenderCurrentScreen = () => {
    const s2 = t();
    document.getElementById("fu-title").textContent = s2.followupTitle(details.length);
    document.getElementById("fu-submit").textContent = s2.continueBtn;
  };
  const chosen = {};
  const s = t();

  root.innerHTML = `
    <div class="floating">
      <h1 id="fu-title">${s.followupTitle(details.length)}</h1>
      <div id="fu-questions"></div>
      <div class="nav-row" style="justify-content:flex-end">
        <button id="fu-submit" disabled>${s.continueBtn}</button>
      </div>
    </div>
  `;

  const container = document.getElementById("fu-questions");
  details.forEach(({ shadow_type, prompt, option_a, option_b }) => {
    const block = el(`
      <div class="question">
        <p class="text">${prompt}</p>
        <div class="followup-options" data-type="${shadow_type}">
          <button type="button" class="fu-opt secondary" data-type="${shadow_type}" data-side="a">${option_a}</button>
          <button type="button" class="fu-opt secondary" data-type="${shadow_type}" data-side="b">${option_b}</button>
        </div>
      </div>
    `);
    container.appendChild(block);
  });

  const submitBtn = document.getElementById("fu-submit");
  const byType = Object.fromEntries(details.map((d) => [d.shadow_type, d]));
  container.addEventListener("click", (e) => {
    const btn = e.target.closest(".fu-opt");
    if (!btn) return;
    const type = btn.dataset.type;
    chosen[type] = btn.dataset.side === "a" ? byType[type].option_a : byType[type].option_b;
    container.querySelectorAll(`.fu-opt[data-type="${type}"]`).forEach((b) => b.classList.remove("selected"));
    btn.classList.add("selected");
    submitBtn.disabled = Object.keys(chosen).length < details.length;
  });

  submitBtn.onclick = async () => {
    renderProcessing(t().processingReport);
    const data = await streamPost("/api/followup-batch", { session_id: sessionId, answers: chosen }, () => {});
    handleTurnResult(data);
  };
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function reportContentHtml(s, report, groundingConcepts) {
  const hasGrounding = groundingConcepts && groundingConcepts.length;
  const groundingHtml = hasGrounding
    ? `<div class="grounding-block">
         <p class="grounding-label" id="relevant-ideas-label">${s.relevantIdeas}</p>
         <ul class="grounding-list">
           ${groundingConcepts.map((c) => `<li>${capitalize(c)}</li>`).join("")}
         </ul>
       </div>`
    : "";
  return `${groundingHtml}${renderReportBody(report || "")}`;
}

function renderReport(data) {
  const s = t();

  // The report was written once by InterpreterAgent in whichever language
  // was selected at generation time. Switching language here translates
  // that existing text via /api/translate-report (a small literal
  // translation, not a full regeneration — so repeated switching doesn't
  // drift into a different narrative) rather than leaving it stuck in the
  // original language. Results are cached per language so toggling back and
  // forth doesn't re-translate every time.
  //
  // Grounding concept labels are handled differently: they're NOT
  // translated, they're MAPPED — the MCP corpus already carries a curated
  // native-language label for each concept (concept_source /
  // concept_source_zh), which the backend returns for both languages
  // upfront. Running a curated label through a generic translator would
  // produce different, less natural phrasing than the one actually written
  // for that language, so this looks it up client-side instead — instant,
  // no network call, and always the real curated text.
  const originalLanguage = currentLanguage;
  const originalReport = data.final_report || "";
  const conceptsByLang = {
    en: data.grounding_concepts_en || [],
    zh: data.grounding_concepts_zh || [],
  };
  const topType = data.top_type;
  const translationCache = {};

  rerenderCurrentScreen = async () => {
    const s2 = t();
    document.getElementById("shadow-label").textContent = s2.yourShadowIs;
    document.getElementById("chat-input").placeholder = s2.chatPlaceholder;
    document.getElementById("chat-send").textContent = s2.send;
    document.getElementById("chat-hint").textContent = s2.chatHint;

    const titles = currentLanguage === "zh" ? SHADOW_TITLES_ZH : SHADOW_TITLES;
    const titleEl = document.getElementById("report-title");
    if (titleEl && topType && titles[topType]) titleEl.textContent = titles[topType];

    const bodyEl = document.getElementById("report-body-wrap");
    if (!bodyEl) return;
    const concepts = conceptsByLang[currentLanguage] || [];

    if (currentLanguage === originalLanguage) {
      bodyEl.innerHTML = reportContentHtml(s2, originalReport, concepts);
      return;
    }
    if (translationCache[currentLanguage]) {
      bodyEl.innerHTML = reportContentHtml(s2, translationCache[currentLanguage], concepts);
      return;
    }
    const requestedLanguage = currentLanguage;
    bodyEl.innerHTML = `<p class="spinner">${s2.processingReport}</p>`;
    const res = await fetch("/api/translate-report", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ report: originalReport, target_language: requestedLanguage }),
    });
    const translated = await res.json();
    // If the user switched again while this was in flight, don't overwrite
    // with a stale result for a language that's no longer selected.
    if (currentLanguage !== requestedLanguage) return;
    translationCache[requestedLanguage] = translated.report;
    bodyEl.innerHTML = reportContentHtml(t(), translated.report, conceptsByLang[requestedLanguage] || []);
  };

  root.innerHTML = `
    <div class="floating" id="report-section">
      <p class="shadow-label" id="shadow-label">${s.yourShadowIs}</p>
      <h1 class="big-title" id="report-title">${data.top_type_title || "Your reflection"}</h1>
      <div id="report-body-wrap">${reportContentHtml(s, originalReport, conceptsByLang[originalLanguage] || [])}</div>
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="${s.chatPlaceholder}" />
      <button id="chat-send">${s.send}</button>
    </div>
    <div class="hint" id="chat-hint">${s.chatHint}</div>
  `;

  const log = document.getElementById("chat-log");
  const input = document.getElementById("chat-input");

  const appendBubble = (text, cls) => {
    const b = el(`<div class="bubble ${cls} floating">${text}</div>`);
    log.appendChild(b);
    b.scrollIntoView({ behavior: "smooth", block: "end" });
    return b;
  };

  const sendChat = async () => {
    const text = input.value.trim();
    if (!text) return;
    appendBubble(text, "user");
    input.value = "";

    const thinkingBubble = appendBubble(
      `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`,
      "agent thinking"
    );

    const data = await streamPost("/api/message", { session_id: sessionId, text }, () => {});

    thinkingBubble.remove();
    appendBubble(data.reply, data.crisis ? "crisis" : "agent");
  };

  document.getElementById("chat-send").onclick = sendChat;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat();
  });
}

document.getElementById("lang-switch").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || btn.classList.contains("active")) return;
  currentLanguage = btn.dataset.lang;
  document.querySelectorAll("#lang-switch button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === currentLanguage);
  });
  rerenderCurrentScreen();
});

renderFraming();
</script>
</body>
</html>
