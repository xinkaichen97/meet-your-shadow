function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function chunk(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}

// Agent names are PascalCase, no underscores (e.g. "AnalystAgent") — this

// "Agent" itself stays English (treated like a proper noun / product term)
// but the descriptive part (Analyst/Follow-Up/Interpreter/Companion) is

const AGENT_NAME_ZH = {
  AnalystAgent: "分析 Agent",
  FollowUpAgent: "追问 Agent",
  InterpreterAgent: "解读 Agent",
  CompanionAgent: "陪伴 Agent",
};
function prettyName(name) {
  if (currentLanguage === "zh" && AGENT_NAME_ZH[name]) return AGENT_NAME_ZH[name];
  return name.replace(/([a-z])([A-Z])/g, "$1 $2");

function tracePillsInner(trace) {
  if (!trace || !trace.length) return "";
  return trace
    .map((tr) =>
      tr.type === "call"
        ? `<span class="pill call">⚡ ${prettyName(tr.name)}</span>`
        : `<span class="pill done">✓ ${prettyName(tr.name)}</span>`
    )
    .join("");
}
function tracePills(trace) {
  const inner = tracePillsInner(trace);
  return inner ? `<div class="trace-row">${inner}</div>` : "";
}

// Parses the "## Section Name\n<body>" format InterpreterAgent's output
// uses (works the same regardless of language, since it just looks for any
// "## " header, not hardcoded English section names). Falls back to plain
// text if it doesn't find any sections (e.g. a model deviation).
function renderReportBody(text) {
  const regex = /##\s+(.+?)\n([\s\S]*?)(?=\n##\s+|$)/g;
  const sections = [];
  let match;
  while ((match = regex.exec(text)) !== null) {
    sections.push({ title: match[1].trim(), body: match[2].trim() });
  }
  if (!sections.length) return `<div class="report">${text}</div>`;
  return sections
    .map((s) => `<div class="narrative-section"><h3>${s.title}</h3><div class="report">${s.body}</div></div>`)
    .join("");
}

// Streams a POST endpoint that responds with SSE ("data: {...}\n\n" chunks).
// Calls onEvent for every non-final chunk (live call/response pills), and
// returns the final chunk once the stream ends.
async function streamPost(url, body, onEvent) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...body, language: currentLanguage }),
  });
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  let finalData = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) !== -1) {
      const raw = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      if (raw.startsWith("data: ")) {
        const obj = JSON.parse(raw.slice(6));
        if (obj.type === "final") {
          finalData = obj;
        } else {
          onEvent(obj);
        }
      }
    }
  }
  return finalData;
}

// Live "calling the agent" screen: header text updates with whichever tool
// is currently in flight, pills accumulate below as call/response events
// stream in. Also feeds lastTrace so the destination screen can still show
// the same pill row.
function renderProcessing(label) {
  lastTrace = [];
  root.innerHTML = `
    <div class="floating">
      <p class="spinner" id="status-text">${label}</p>
      <div class="trace-row" id="live-pills"></div>
    </div>
  `;
  const statusEl = document.getElementById("status-text");
  const pillsEl = document.getElementById("live-pills");
  return {
    onEvent(evt) {
      lastTrace.push(evt);
      const name = prettyName(evt.name);
      if (evt.type === "call") {
        statusEl.textContent = t().calling(name);
        pillsEl.insertAdjacentHTML("beforeend", `<span class="pill call">⚡ ${name}</span>`);
      } else {
        statusEl.textContent = t().responded(name);
        pillsEl.insertAdjacentHTML("beforeend", `<span class="pill done">✓ ${name}</span>`);
      }
    },
  };
}

function renderFraming() {
  rerenderCurrentScreen = renderFraming;
  const s = t();
  root.innerHTML = `
    <div class="framing floating">
      <h1 class="hero-title">${s.heroTitle}</h1>
      <img class="hero-thumb" src="/img/thumbnail.png" alt="" />
      <p class="hero-lead">${s.heroLead1}</p>
      <p class="hero-lead">${s.heroLead2}</p>
      <div class="nav-row" style="justify-content:flex-end">
        <button id="start-btn">${s.startBtn}</button>
      </div>
    </div>`;
  document.getElementById("start-btn").onclick = () => renderQuiz();
}

function renderQuiz() {
  // Shuffle is over question IDs, not full {id, text} objects, so a
  // language switch mid-quiz can re-render the same shuffled order with
  // fresh text instead of re-shuffling.
  const orderIds = shuffled(QUESTIONS.map((q) => q.id));
  const groupsIds = chunk(orderIds, GROUP_SIZE);
  const answers = {};
  let groupIndex = 0;

  root.innerHTML = `<div id="quiz-shell"></div>`;
  const shell = document.getElementById("quiz-shell");

  function renderGroup() {
    rerenderCurrentScreen = renderGroup;
    const s = t();
    const gIds = groupsIds[groupIndex];
    const isLast = groupIndex === groupsIds.length - 1;
    const answeredCount = gIds.filter((id) => answers[id] !== undefined).length;

    shell.innerHTML = `
      <div class="floating" id="group-block">
        <div id="questions"></div>
        <div class="nav-row">
          ${groupIndex > 0 ? `<button class="link" id="back-btn">${s.back}</button>` : `<span></span>`}
          <button id="next-btn" disabled>${isLast ? s.submit : s.next}</button>
        </div>
      </div>
    `;

    const qcontainer = document.getElementById("questions");
    gIds.forEach((id) => {
      const block = el(`
        <div class="question">
          <p class="text">${currentQuestionText(id)}</p>
          <div class="scale" data-qid="${id}">
            ${[1, 2, 3, 4, 5].map((v) => `<button type="button" class="dotbtn${answers[id] === v ? " selected" : ""}" data-v="${v}">${v}</button>`).join("")}
          </div>
          <div class="scale-labels"><span>${s.scaleLow}</span><span>${s.scaleHigh}</span></div>
        </div>
      `);
      qcontainer.appendChild(block);
    });

    const nextBtn = document.getElementById("next-btn");
    nextBtn.disabled = answeredCount < GROUP_SIZE;

    qcontainer.querySelectorAll(".scale").forEach((scaleEl) => {
      scaleEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".dotbtn");
        if (!btn) return;
        const qid = scaleEl.dataset.qid;
        answers[qid] = parseInt(btn.dataset.v, 10);
        scaleEl.querySelectorAll(".dotbtn").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        const count = gIds.filter((qq) => answers[qq] !== undefined).length;
        nextBtn.disabled = count < GROUP_SIZE;
      });
    });

    if (groupIndex > 0) {
      document.getElementById("back-btn").onclick = () => {
        groupIndex -= 1;
        renderGroup();
      };
    }

    nextBtn.onclick = async () => {
      if (!isLast) {
        groupIndex += 1;
        renderGroup();
        return;
      }
      const proc = renderProcessing(t().scoringAnswers());
      const data = await streamPost("/api/answers", { answers }, proc.onEvent);
      sessionId = data.session_id;
      handleTurnResult(data);
    };
  }

  renderGroup();
}

function handleTurnResult(data) {
  if (!data.report_generated && data.followup_queue && data.followup_queue.length) {
    renderFollowupPage(data.followup_queue);
    return;
  }
  if (data.report_generated) {
    renderReport(data);
    return;
  }
  renderReport({ final_report: data.reply, top_type_title: data.top_type_title });
}

function renderFollowupPage(queue) {
  rerenderCurrentScreen = () => renderFollowupPage(queue);
  const chosen = {};
  const s = t();
  const templates = currentFollowupTemplates();

  root.innerHTML = `
    <div class="floating">
      <h1>${s.followupTitle}</h1>
      <div id="fu-questions"></div>
      <div class="nav-row" style="justify-content:flex-end">
        <button id="fu-submit" disabled>${s.continueBtn}</button>
      </div>
    </div>
  `;

  const container = document.getElementById("fu-questions");
  queue.forEach((type) => {
    const template = templates[type];
    const block = el(`
      <div class="question">
        <p class="text">${template.prompt}</p>
        <div class="followup-options" data-type="${type}">
          <button type="button" class="fu-opt secondary" data-type="${type}" data-side="a">${template.option_a}</button>
          <button type="button" class="fu-opt secondary" data-type="${type}" data-side="b">${template.option_b}</button>
        </div>
      </div>
    `);
    container.appendChild(block);
  });

  const submitBtn = document.getElementById("fu-submit");
  container.addEventListener("click", (e) => {
    const btn = e.target.closest(".fu-opt");
    if (!btn) return;
    const type = btn.dataset.type;
    const template = templates[type];
    chosen[type] = btn.dataset.side === "a" ? template.option_a : template.option_b;
    container.querySelectorAll(`.fu-opt[data-type="${type}"]`).forEach((b) => b.classList.remove("selected"));
    btn.classList.add("selected");
    submitBtn.disabled = Object.keys(chosen).length < queue.length;
  });

  submitBtn.onclick = async () => {
    const proc = renderProcessing(t().sendingFollowup());
    const data = await streamPost("/api/followup-batch", { session_id: sessionId, answers: chosen }, proc.onEvent);
    handleTurnResult(data);
  };
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function renderReport(data) {
  const s = t();
  const hasGrounding = data.grounding_concepts && data.grounding_concepts.length;
  const pillsInner = tracePillsInner(lastTrace) + (hasGrounding ? `<span class="pill done">✓ ${s.mcpPillLabel}</span>` : "");
  const pillsRow = pillsInner ? `<div class="trace-row">${pillsInner}</div>` : "";
  const groundingHtml = hasGrounding
    ? `<div class="grounding-block">
         <p class="grounding-label" id="relevant-ideas-label">${s.relevantIdeas}</p>
         <ul class="grounding-list">
           ${data.grounding_concepts.map((c) => `<li>${capitalize(c)}</li>`).join("")}
         </ul>
       </div>`
    : "";

  // Switching language on this screen only relabels the surrounding chrome
  // in place — it never re-renders the report body or chat log, since
  // already-generated content doesn't retroactively translate.
  rerenderCurrentScreen = () => {
    const s2 = t();
    document.getElementById("shadow-label").textContent = s2.yourShadowIs;
    const gl = document.getElementById("relevant-ideas-label");
    if (gl) gl.textContent = s2.relevantIdeas;
    document.getElementById("chat-input").placeholder = s2.chatPlaceholder;
    document.getElementById("chat-send").textContent = s2.send;
    document.getElementById("chat-hint").textContent = s2.chatHint;
  };

  root.innerHTML = `
    <div class="floating" id="report-section">
      <p class="shadow-label" id="shadow-label">${s.yourShadowIs}</p>
      <h1 class="big-title">${data.top_type_title || "Your reflection"}</h1>
      ${pillsRow}
      ${groundingHtml}
      ${renderReportBody(data.final_report || "")}
    </div>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="${s.chatPlaceholder}" />
      <button id="chat-send">${s.send}</button>
    </div>
    <div class="hint" id="chat-hint">${s.chatHint}</div>
  `;

  const log = document.getElementById("chat-log");
  const input = document.getElementById("chat-input");

  const appendBubble = (text, cls) => {
    const b = el(`<div class="bubble ${cls} floating">${text}</div>`);
    log.appendChild(b);
    b.scrollIntoView({ behavior: "smooth", block: "end" });
    return b;
  };

  const sendChat = async () => {
    const text = input.value.trim();
    if (!text) return;
    appendBubble(text, "user");
    input.value = "";

    // The call pill appears live, as soon as the request goes out — not
    // after the fact. CompanionAgent is a real separate agent, so its
    // actual name is what's shown (no hardcoded override needed).
    let pillsRow = null;
    const thinkingBubble = appendBubble(
      `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`,
      "agent thinking"
    );

    const data = await streamPost("/api/message", { session_id: sessionId, text }, (evt) => {
      if (!pillsRow) {
        pillsRow = el(`<div class="trace-row"></div>`);
        log.insertBefore(pillsRow, thinkingBubble);
      }
      const icon = evt.type === "call" ? "⚡" : "✓";
      const cls = evt.type === "call" ? "call" : "done";
      pillsRow.insertAdjacentHTML("beforeend", `<span class="pill ${cls}">${icon} ${prettyName(evt.name)}</span>`);
    });

    thinkingBubble.remove();
    appendBubble(data.reply, data.crisis ? "crisis" : "agent");
  };

  document.getElementById("chat-send").onclick = sendChat;
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat();
  });
}

document.getElementById("lang-switch").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || btn.classList.contains("active")) return;
  currentLanguage = btn.dataset.lang;
  document.querySelectorAll("#lang-switch button").forEach((b) => {
    b.classList.toggle("active", b.dataset.lang === currentLanguage);
  });
  rerenderCurrentScreen();
});

renderFraming();
</script>
